[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clowder"
version = "0.1.0"
description = "One front door for a crew of coding agents: dispatch and state."
readme = "README.md"
requires-python = ">=3.15"
license = { file = "LICENSE" }
keywords = ["agents", "dispatch", "worktree", "pi"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
clowder = "clowder.cli:main"

[tool.setuptools]
packages = ["clowder"]

[tool.ruff]
# The code is written for readable lines rather than the 88-character default.
line-length = 96
# The owner's decision, 2026-10-05: keep the 3.15 target. Under this target ruff
# rewrites `except (A, B):` into `except A, B:` (PEP 758). That rewrite is
# behaviour-preserving on 3.15, and modern 3.15 code - including t-strings -
# matters more than holding the formatter back to protect against it.
#
# The ruff version itself is pinned in scripts/check.py (TOOL_PINS). It has to
# be: an unpinned formatter passes on a developer's older ruff and fails on the
# runner's newer one, which is how four markdown code blocks drifted out of
# format while the gate stayed green locally and red in CI.
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
