name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Auto-cancel stale runs when a newer commit lands on the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per gate, so a red check names the gate that failed rather than
  # hiding it inside one long run. The gate list itself lives in
  # scripts/check.py, which is the same list a human runs locally.
  gates:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gate: [smoke, lint, format, type, tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run the ${{ matrix.gate }} gate
        run: python scripts/check.py --only ${{ matrix.gate }}
